# Dependabot configuration for vscode-phpcs.
#
# Unlike the sibling PHP repositories there is no `target-branch` here: this
# repository's default branch is `develop`, which is also the branch releases
# are cut from, so version updates belong there directly.
#
# Minor and patch updates are grouped into a single pull request per ecosystem
# and auto-merged once the required checks on `develop` pass (see
# .github/workflows/dependabot-auto-merge.yml). Major updates always fall out
# of the groups into their own pull request and are always reviewed by hand.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 7 days before proposing updates to newly published versions, to
    # reduce exposure to a compromised or yanked release (supply-chain).
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
    # The workflows pin actions by commit SHA with the version in a trailing
    # comment; Dependabot rewrites both together, which is the whole reason the
    # pins stay readable.
    groups:
      github-actions:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    # Three independent installs, none of them npm workspaces: the repository
    # root (build, test and lint tooling), the VS Code extension client, and the
    # language server. Listing them together lets a single grouped pull request
    # span all three.
    directories:
      - '/'
      - '/phpcs'
      - '/phpcs-server'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    # Dependabot's default ceiling on open version-update PRs is five. Once it
    # is reached Dependabot stops opening new ones — silently, with nothing to
    # indicate an update was withheld — so a group can be starved by unrelated
    # PRs sitting in review. Ten leaves headroom for the groups below plus the
    # major-version PRs and a security update or two.
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # `@types/vscode` is pinned to `engines.vscode` in phpcs/package.json by
      # hand, because bumping it is not a dependency update — it is a decision
      # to raise the minimum VS Code version the extension will install on.
      # vsce enforces the pairing and refuses to package when the types are
      # newer than the declared engine, which the `lint` job catches (#45), so
      # every such bump arrives as a red pull request that cannot be merged
      # without also editing the manifest.
      #
      # There is nothing to gain by taking them. The client imports only
      # long-stable API — window, workspace, commands, StatusBarItem, Uri,
      # OutputChannel, ExtensionContext — and a survey of the 1.107…1.125
      # release notes found no linting, diagnostics or code-action API added in
      # that range. The one worthwhile addition, LSP 3.18, comes from
      # vscode-languageclient 10, which itself declares `engines.vscode ^1.91.0`
      # and so needs no change here at all.
      #
      # Raise both together, deliberately, if a newer API is ever wanted.
      - dependency-name: '@types/vscode'

      # `@types/node` tracks the MINIMUM runtime we support, not the newest.
      # That floor is the oldest VS Code we run on, because the language server
      # executes in its extension host: 1.106.3 is Electron 37.7.0, which is
      # Node 22.20.0. Typing against anything newer would let code compile
      # against APIs that are simply absent on the runtime we claim to support,
      # and unlike `@types/vscode` there is no vsce-style check to catch it.
      #
      # #64 proposed 26. Widening the CI matrix upward (22, 24, 26) is not an
      # argument for it: the matrix is the range we support, and the types have
      # to match its floor. Raise this only when the floor itself moves, which
      # means raising engines.vscode first.
      #
      # Majors only — 22.x type fixes should keep flowing.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

      # TypeScript 7 (the native port) cannot be adopted yet: ts-node crashes
      # against it, so the client suite cannot load, and @types/mocha stops
      # resolving from the root node_modules into the sub-projects. Both are
      # tracked in #75, along with the tsx migration that would unblock the
      # first. Drop this ignore when that issue closes.
      #
      # Majors only — 5.x updates should keep flowing.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    # Groups are matched in the order they are declared — a dependency joins the
    # FIRST group whose patterns match — so any specific group must precede the
    # catch-all.
    groups:
      # One pull request per week covering every minor and patch bump across all
      # three directories, which also keeps the devDependencies shared between
      # them (mocha, tsx, typescript, …) on the same version everywhere.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
