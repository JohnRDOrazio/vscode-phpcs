name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The runtime range the extension has to work across: the language
        # server runs in VS Code's extension host, whose Node version is the
        # host's choice, not ours. Unrelated to the newer Node the developer
        # tooling needs — see .node-version and the `tooling` job.
        # 26 is still Current rather than LTS (24 is LTS "Krypton" until 26
        # promotes in October 2026). It is here to catch breakage early, not
        # because anything ships on it yet.
        node-version: [20, 22, 24, 26]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Bundle
        run: npm run bundle

      - name: Run unit tests
        run: npm run test:server:unit

      # The client suite was reachable only through the root `npm test`, which
      # nothing in CI ran — publish.yml was the first thing to execute it, on a
      # tag. Run it here so it gets the same cross-platform and Node coverage as
      # the server unit tests.
      - name: Run client tests
        run: npm run test:client

  phpcs-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both lines are held at or above the fix for CVE-2026-67434 (OS command
        # injection, PHPCS < 3.13.6 and >= 4.0.0 < 4.0.2). Composer refuses to
        # install a release covered by an advisory, so anything below these
        # fails to resolve rather than installing something vulnerable.
        phpcs-version: ['3.13.6', '4.0.4']
        php-version: ['8.1', '8.3']
        install-type: ['global', 'local']
        exclude:
          # PHPCS 4.x works best with PHP 8.3
          - phpcs-version: '4.0.4'
            php-version: '8.1'
      fail-fast: false

    name: PHPCS ${{ matrix.phpcs-version }} (${{ matrix.install-type }}) / PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install PHPCS globally
        if: matrix.install-type == 'global'
        run: composer global require "squizlabs/php_codesniffer:${{ matrix.phpcs-version }}"

      - name: Install PHPCS locally
        if: matrix.install-type == 'local'
        run: composer require --dev "squizlabs/php_codesniffer:${{ matrix.phpcs-version }}"

      - name: Verify PHPCS installation
        run: |
          if [ "${{ matrix.install-type }}" = "global" ]; then
            phpcs --version
            which phpcs
          else
            ./vendor/bin/phpcs --version
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Bundle
        run: npm run bundle

      - name: Run integration tests
        env:
          PHPCS_PATH: ${{ matrix.install-type == 'global' && 'phpcs' || format('{0}/vendor/bin/phpcs', github.workspace) }}
        run: npm run test:server:integration

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHPCS/PHPCBF globally
        run: composer global require "squizlabs/php_codesniffer:^3.10"

      - name: Verify PHPCS installation
        run: |
          phpcs --version
          phpcbf --version

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Bundle
        run: npm run bundle

      - name: Run tests with coverage
        run: npm run test:server:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./phpcs-server/coverage
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint markdown
        run: npm run lint:md

      - name: Bundle
        run: npm run bundle

      # `vsce package` is the only check that catches `@types/vscode` drifting
      # ahead of `engines.vscode` in phpcs/package.json — it refuses to package
      # when the types are newer than the engine the extension declares. Without
      # this step the mismatch would first surface in the publish workflow, on a
      # tag, after the offending dependency bump had already been merged.
      - name: Verify the extension packages
        run: npm run package

  # Runs the pre-commit tooling the way a contributor's machine runs it, on the
  # Node version .node-version actually hands them.
  #
  # This job exists because of #52: lint-staged 17 requires Node >= 22.22.1 while
  # .node-version pinned 20, and the pull request was green and mergeable the
  # whole time — nothing in CI ran lint-staged, so the break would first have
  # appeared at a contributor's next `git commit`. Note that the *coverage* here
  # is redundant with `lint` (the only configured task is markdownlint over
  # *.md, which `lint:md` already runs over everything); what is not redundant is
  # proving the tooling itself still executes on the pinned Node.
  tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `lint-staged --diff` needs both ends of the range; a shallow clone
          # has neither the base commit nor the merge base.
          fetch-depth: 0

      # Deliberately not a matrix entry: the point is the pinned developer Node,
      # not the runtime range that `build` covers.
      - name: Setup Node.js from .node-version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # There are no staged files in CI, so drive lint-staged off the diff
      # instead — same tasks, same code path, over the commits under review.
      - name: Run pre-commit tasks over the changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            RANGE="$BASE_SHA...HEAD"
          else
            RANGE="HEAD~1...HEAD"
          fi
          echo "Running lint-staged over $RANGE"
          npm run lint-staged -- --diff="$RANGE"

  # The single status check that branch protection should require from this
  # workflow.
  #
  # Every other job here is a matrix job whose name embeds the PHPCS, PHP, Node
  # and OS versions it runs against, so requiring those contexts directly means
  # the protection rules have to be rewritten by hand on every bump. Worse, the
  # failure mode is silent and total: a required context that stops reporting —
  # because the version in its name changed — is never satisfied, so every pull
  # request is blocked until someone notices the rule is stale. Requiring only
  # this job leaves the matrix underneath free to change.
  #
  # `security`, in snyk.yml, is required separately: `needs` cannot reach across
  # workflows, and that job's name is already static.
  ci-required:
    runs-on: ubuntu-latest
    needs: [build, phpcs-integration, coverage, lint, tooling]
    # Without `if: always()` this job is skipped whenever an upstream job fails,
    # and branch protection counts a skipped check as a passing one — which
    # would make the gate wave through exactly the failures it exists to catch.
    if: always()

    steps:
      - name: Verify every upstream job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::CI did not pass — an upstream job reported '$result'"
              exit 1
            fi
          done
          echo "All upstream jobs succeeded."
